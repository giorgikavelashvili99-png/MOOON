<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>TikTok - MOONFULL 4K</title>
<style>:root{color-scheme:dark}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07070d;color:#d9dbe6;font:16px system-ui,sans-serif}</style></head>
<body><p id="m">TikTok...</p>
<script>
(function(){
var q=new URLSearchParams(location.search),m=document.getElementById('m');
var code=q.get('code'),state=q.get('state'),err=q.get('error');
var back='https://moonfull4k.xyz/';
if(err||!code){m.textContent='TikTok login cancelled';setTimeout(function(){location.replace(back)},1500);return;}
var saved='';try{saved=sessionStorage.getItem('tt_state')||''}catch(e){}
if(saved&&state!==saved){m.textContent='Invalid state';setTimeout(function(){location.replace(back)},1500);return;}
var verifier='';try{verifier=sessionStorage.getItem('tt_verifier')||''}catch(e){}
fetch('https://curly-grass-9b0e.giorgikavelashvili99.workers.dev/exchange',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:code,verifier:verifier,redirect_uri:location.origin+location.pathname})})
.then(function(r){return r.json()}).then(function(d){
  if(!d||!d.token||!d.user)throw 0;try{localStorage.setItem('moon_tt_token',d.token);localStorage.setItem('moon_discord_user_cache',JSON.stringify({id:'tt_'+d.user.open_id,username:d.user.name||'TikTok',avatarUrl:d.user.avatar||'',provider:'tiktok'}))}catch(e){}
  location.replace(back+'?tt=ok');
}).catch(function(){m.textContent='Server error';setTimeout(function(){location.replace(back)},1800)});
})();
</script></body></html>
