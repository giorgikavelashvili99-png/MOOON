<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MOON — ვიდეო მონტაჟის კალკულატორი</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #08080d;
    --bg-alt: #0d0d15;
    --panel: #12121c;
    --panel-2: #171724;
    --border: #26263a;
    --border-soft: #1c1c2b;
    --text: #f1f1f6;
    --text-dim: #8b8ba3;
    --text-faint: #55556b;
    --purple: #9b5cff;
    --purple-soft: rgba(155,92,255,0.35);
    --cyan: #2ee6d6;
    --cyan-soft: rgba(46,230,214,0.35);
    --warn: #ff6b6b;
    --warn-soft: rgba(255,107,107,0.35);
    --gold: #ffd27a;
    --tg: #2ea6ff;
    --tg-soft: rgba(46,166,255,0.35);
    --wa: #25D366;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }

  html,body{
    margin:0; padding:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Space Grotesk', sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }

  /* ---------- Background atmosphere ---------- */
  .bg-layer{
    position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;
  }
  .grain{
    position:absolute; inset:-100px;
    background-image:
      radial-gradient(circle at 20% 20%, rgba(255,255,255,0.02) 0, transparent 1px);
    background-size: 3px 3px;
    opacity:0.5;
  }
  .ruler{
    position:absolute; inset:0;
    background-image: repeating-linear-gradient(
      90deg,
      rgba(255,255,255,0.028) 0px,
      rgba(255,255,255,0.028) 1px,
      transparent 1px,
      transparent 80px
    );
    opacity:0.6;
    mask-image: linear-gradient(180deg, transparent, black 15%, black 85%, transparent);
  }
  .orb{
    position:absolute; border-radius:50%;
    filter:blur(90px);
    opacity:0.35;
  }
  .orb.o1{ width:520px; height:520px; top:-160px; left:-120px; background:radial-gradient(circle, var(--purple), transparent 70%); animation: drift1 22s ease-in-out infinite; }
  .orb.o2{ width:460px; height:460px; bottom:-140px; right:-100px; background:radial-gradient(circle, var(--cyan), transparent 70%); animation: drift2 26s ease-in-out infinite; }
  .orb.o3{ width:340px; height:340px; top:40%; left:60%; background:radial-gradient(circle, var(--purple), transparent 70%); opacity:0.18; animation: drift1 18s ease-in-out infinite reverse; }

  @keyframes drift1{ 0%,100%{ transform:translate(0,0) } 50%{ transform:translate(40px,30px) } }
  @keyframes drift2{ 0%,100%{ transform:translate(0,0) } 50%{ transform:translate(-30px,-40px) } }

  .badge-float{
    position:absolute;
    font-family:'JetBrains Mono', monospace;
    font-weight:800;
    letter-spacing:0.08em;
    border:1px solid var(--border);
    border-radius:14px;
    padding:10px 16px;
    background:rgba(18,18,28,0.4);
    backdrop-filter: blur(6px);
    color:var(--text-dim);
    user-select:none;
  }
  .badge-float.ae{
    top:14%; right:6%;
    color:#c7aaff;
    text-shadow: 0 0 18px rgba(155,92,255,0.55);
    border-color: rgba(155,92,255,0.3);
    box-shadow: 0 0 30px rgba(155,92,255,0.12);
    animation: float 7s ease-in-out infinite;
  }
  .badge-float.topaz{
    bottom:16%; left:5%;
    color:#9df4e9;
    text-shadow: 0 0 18px rgba(46,230,214,0.55);
    border-color: rgba(46,230,214,0.3);
    box-shadow: 0 0 30px rgba(46,230,214,0.12);
    animation: float 8s ease-in-out infinite 1s;
  }
  .badge-float .gem{
    display:inline-block; width:9px; height:9px; margin-left:8px;
    background:var(--cyan); transform:rotate(45deg);
    box-shadow:0 0 10px var(--cyan);
  }
  .badge-float .spark{
    display:inline-block; width:7px; height:7px; margin-left:8px;
    background:var(--purple); border-radius:2px;
    box-shadow:0 0 10px var(--purple);
  }
  @keyframes float{ 0%,100%{ transform:translateY(0) } 50%{ transform:translateY(-14px) } }

  @media (max-width: 820px){ .badge-float{ display:none; } }

  /* ---------- Layout ---------- */
  .wrap{ position:relative; z-index:1; max-width:760px; margin:0 auto; padding:28px 20px 80px; }

  .topbar{
    display:flex; align-items:center; gap:8px 14px;
    padding:14px 18px; margin-bottom:34px;
    border:1px solid var(--border-soft);
    border-radius:16px;
    background:rgba(15,15,24,0.55);
    backdrop-filter: blur(10px);
  }
  .brand{ order:1; flex:0 0 auto; display:flex; align-items:center; gap:10px; font-weight:700; letter-spacing:0.05em; font-size:16px; }
  .brand .name{
    color:#f2ecff;
    text-shadow:
      0 0 6px rgba(255,255,255,0.7),
      0 0 16px rgba(155,92,255,0.9),
      0 0 34px rgba(155,92,255,0.6),
      0 0 60px rgba(46,230,214,0.35);
  }
  .brand .dot{ width:9px; height:9px; border-radius:50%; background:var(--cyan); box-shadow:0 0 12px var(--cyan); }
  .visitors-badge{
    font-family:'JetBrains Mono', monospace; font-size:11.5px; color:var(--text-dim);
    display:inline-flex; align-items:center; gap:4px;
    border:1px solid var(--border-soft); border-radius:8px;
    padding:2px 7px; margin-left:2px;
    background:rgba(18,18,28,0.4);
  }
  .visitors-badge b{ color:var(--gold); font-weight:700; text-shadow:0 0 8px rgba(255,210,122,0.5); }

  .topbar-center{
    order:2;
    flex:1;
    display:flex; align-items:center; justify-content:center; gap:8px;
    font-family:'JetBrains Mono', monospace;
    font-size:11px; font-weight:700; letter-spacing:0.14em;
    text-transform:uppercase; white-space:nowrap;
    color:#bff6ef;
    text-shadow:
      0 0 6px rgba(255,255,255,0.55),
      0 0 14px rgba(46,230,214,0.8),
      0 0 30px rgba(46,230,214,0.45);
  }
  .topbar-center .tc-dot{
    width:6px; height:6px; border-radius:50%;
    background:var(--cyan); box-shadow:0 0 10px var(--cyan);
    animation:pulse 1.6s infinite;
  }

  .topbar-right{ order:3; flex:0 0 auto; display:flex; align-items:center; gap:14px; }
  .lang-switch{ display:flex; align-items:center; gap:6px; }
  .lang-btn{
    width:44px; height:32px; border-radius:9px;
    background:#0e0e17; border:1px solid var(--border);
    font-family:'JetBrains Mono', monospace;
    font-size:11.5px; font-weight:800; letter-spacing:0.04em;
    line-height:1; cursor:pointer;
    color:#ffffff;
    display:flex; align-items:center; justify-content:center;
    opacity:0.45; transition: opacity .2s, border-color .2s, transform .15s, box-shadow .2s, text-shadow .2s;
  }
  .lang-btn:hover{ opacity:0.8; transform:translateY(-1px); }
  .lang-btn.active{
    opacity:1; border-color: var(--purple-soft);
    box-shadow: 0 0 14px rgba(155,92,255,0.35);
    text-shadow:
      0 0 6px rgba(255,255,255,0.9),
      0 0 14px rgba(255,255,255,0.7),
      0 0 28px rgba(155,92,255,0.7),
      0 0 50px rgba(155,92,255,0.45);
  }
  @media (max-width: 640px){
    .topbar{ flex-wrap:wrap; }
    .topbar-right{ order:2; margin-left:auto; }
    .topbar-center{
      order:3; flex:1 1 100%;
      font-size:9.5px; letter-spacing:0.1em; gap:6px;
      margin-top:2px;
    }
  }
  @media (max-width: 420px){
    .brand{ flex-wrap:wrap; row-gap:6px; }
  }

  .hero{ text-align:center; margin-bottom:38px; }
  .eyebrow{
    font-family:'JetBrains Mono', monospace; font-size:12px; font-weight:700; letter-spacing:0.22em;
    color:#bff6ef; text-transform:uppercase; margin-bottom:14px;
    text-shadow:
      0 0 6px rgba(255,255,255,0.5),
      0 0 14px rgba(46,230,214,0.85),
      0 0 30px rgba(46,230,214,0.55),
      0 0 55px rgba(46,230,214,0.3);
  }
  .hero h1{
    font-size:clamp(28px, 5vw, 42px); line-height:1.15; margin:0 0 12px;
    font-weight:700;
  }
  .hero h1 span{
    background:linear-gradient(90deg, var(--purple), var(--cyan));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .hero p{ color:var(--text-dim); font-size:15px; max-width:520px; margin:0 auto; }

  /* ---------- Panel ---------- */
  .panel{
    background:linear-gradient(180deg, var(--panel), var(--panel-2));
    border:1px solid var(--border);
    border-radius:22px;
    padding:28px;
    margin-bottom:22px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  .panel-head{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:22px;
  }
  .panel-head .label{
    font-family:'JetBrains Mono', monospace; font-size:11px; font-weight:700; letter-spacing:0.16em;
    color:#a99cff; text-transform:uppercase;
    text-shadow: 0 0 6px rgba(255,255,255,0.4), 0 0 14px rgba(155,92,255,0.75), 0 0 30px rgba(155,92,255,0.4);
  }
  .rec{ display:flex; align-items:center; gap:7px; font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--warn); }
  .rec .r-dot{ width:7px; height:7px; border-radius:50%; background:var(--warn); box-shadow:0 0 10px var(--warn); animation:pulse 1.6s infinite; }
  @keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:0.3} }

  /* Timecode readout */
  .readout{
    text-align:center;
    padding:34px 10px 30px;
    border-radius:16px;
    background:radial-gradient(ellipse at center, rgba(155,92,255,0.08), transparent 70%), rgba(6,6,10,0.6);
    border:1px solid var(--border-soft);
    margin-bottom:26px;
    position:relative;
  }
  .readout .tag{ font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--text-faint); letter-spacing:0.14em; margin-bottom:10px; }
  .price{
    font-family:'JetBrains Mono', monospace;
    font-weight:800;
    font-size:clamp(44px, 11vw, 72px);
    line-height:1;
    color:#fff;
    letter-spacing:0.01em;
    transition: text-shadow 0.25s ease;
    text-shadow:
      0 0 10px rgba(155,92,255,0.9),
      0 0 26px rgba(155,92,255,0.7),
      0 0 55px rgba(46,230,214,0.45),
      0 0 90px rgba(46,230,214,0.25);
  }
  .price sup{ font-size:0.4em; margin-left:6px; color:var(--cyan); text-shadow:0 0 16px var(--cyan); }
  .price.bump{ animation: bump 0.35s ease; }
  @keyframes bump{ 0%{ transform:scale(1) } 40%{ transform:scale(1.045) } 100%{ transform:scale(1) } }

  .sub-note{ margin-top:10px; font-size:12.5px; color:var(--text-dim); }
  .sub-note b{ color:var(--gold); }

  /* Timeline control */
  .field{ margin-bottom:22px; }
  .field-top{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:10px; }
  .field-top label{ font-size:13px; color:var(--text-dim); font-weight:500; }
  .field-top .val{
    font-family:'JetBrains Mono', monospace; font-weight:700; font-size:14px; color:var(--cyan);
    text-shadow:0 0 10px rgba(46,230,214,0.5);
  }

  .timeline{
    position:relative;
    height:56px;
    border-radius:12px;
    background:
      repeating-linear-gradient(90deg, rgba(255,255,255,0.05) 0 1px, transparent 1px 10%);
    background-color:#0a0a12;
    border:1px solid var(--border);
    display:flex; align-items:center; padding:0 4px;
  }
  .timeline input[type=range]{
    -webkit-appearance:none; appearance:none;
    width:100%; height:6px; border-radius:6px;
    background:linear-gradient(90deg, var(--purple), var(--cyan));
    outline:none; cursor:pointer;
  }
  .timeline input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none;
    width:20px; height:20px; border-radius:5px;
    background:#fff;
    border:3px solid var(--purple);
    box-shadow:0 0 14px rgba(155,92,255,0.8), 0 0 0 5px rgba(155,92,255,0.15);
    cursor:grab;
  }
  .timeline input[type=range]::-moz-range-thumb{
    width:20px; height:20px; border-radius:5px;
    background:#fff; border:3px solid var(--purple);
    box-shadow:0 0 14px rgba(155,92,255,0.8);
    cursor:grab;
  }
  .timeline input[type=range]:disabled{ opacity:0.4; cursor:not-allowed; }
  .timeline input[type=range]:disabled::-webkit-slider-thumb{ cursor:not-allowed; }

  .num-input{
    width:100%;
    background:#0a0a12;
    border:1px solid var(--border);
    border-radius:12px;
    padding:14px 16px;
    color:var(--text);
    font-family:'JetBrains Mono', monospace;
    font-size:15px;
    outline:none;
    transition:border-color 0.2s, box-shadow 0.2s;
  }
  .num-input:focus{ border-color:var(--purple); box-shadow:0 0 0 3px rgba(155,92,255,0.15); }

  .num-input.error {
    border-color: var(--warn) !important;
    box-shadow: 0 0 15px rgba(255,107,107,0.4) !important;
  }
  .error-msg {
    color: var(--warn);
    font-size: 12px;
    margin-top: 8px;
    display: none;
    font-weight: 600;
    text-shadow: 0 0 8px rgba(255,107,107,0.4);
  }

  .hint{ font-size:11.5px; color:var(--text-faint); margin-top:8px; }

  /* ---------- Price comparison chart ---------- */
  .chart-box{
    margin-top:16px; padding:16px 16px 8px; background:#0a0a12;
    border:1px solid var(--border); border-radius:14px;
  }
  .chart-head-row{
    display:flex; align-items:center; justify-content:space-between;
    cursor:pointer; user-select:none; margin-bottom:12px;
  }
  .chart-box .chart-label{
    font-size:11px; letter-spacing:0.08em; text-transform:uppercase;
    color:var(--text-faint); margin-bottom:0; font-weight:600;
  }
  .chart-toggle{
    background:none; border:1px solid var(--border); color:var(--text-dim);
    width:26px; height:26px; border-radius:8px; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;
    font-size:12px; cursor:pointer; transition: transform .25s ease, border-color .2s, color .2s;
  }
  .chart-box.open .chart-toggle{ transform:rotate(180deg); border-color:var(--purple-soft); color:var(--text); }
  /* grid-template-rows 0fr -> 1fr is the smoothest cross-device collapse:
     no fixed pixel heights to (mis)calculate, so it never jumps or jitters
     on resize/rotation, and animates on the GPU on both mobile and desktop. */
  .chart-content-wrap{
    display:grid; grid-template-rows:0fr; transition: grid-template-rows .3s ease;
  }
  .chart-box.open .chart-content-wrap{ grid-template-rows:1fr; }
  .chart-content-inner{ overflow:hidden; min-height:0; }
  .chart-row{
    display:flex; align-items:center; gap:10px; margin-bottom:9px;
  }
  .chart-row .cr-name{
    width:78px; flex-shrink:0; font-size:11.5px; color:var(--text-dim);
    font-family:'JetBrains Mono', monospace;
  }
  .chart-row .cr-track{
    flex:1; height:16px; background:#14141f; border-radius:8px; overflow:hidden;
    border:1px solid var(--border-soft);
  }
  .chart-row .cr-fill{
    height:100%; border-radius:8px;
    background:linear-gradient(90deg, var(--purple), var(--warn) 55%, var(--cyan));
    opacity:0.45; transition:width .35s ease, opacity .2s ease;
  }
  .chart-row.active .cr-fill{ opacity:1; box-shadow:0 0 12px var(--cyan-soft); }
  .chart-row.active .cr-name{ color:var(--text); font-weight:700; }
  .chart-row .cr-price{
    width:56px; flex-shrink:0; text-align:right; font-size:11.5px;
    font-family:'JetBrains Mono', monospace; color:var(--text-dim);
  }
  .chart-row.active .cr-price{ color:#9df4e9; font-weight:700; }

  /* ---------- Comments section ---------- */
  .comments-panel .c-form{ display:flex; flex-direction:column; gap:10px; margin-bottom:18px; }
  .comments-panel input.c-name,
  .comments-panel textarea.c-text{
    width:100%; background:#0a0a12; border:1px solid var(--border); border-radius:12px;
    color:var(--text); padding:12px 14px; font-family:'Space Grotesk', sans-serif;
    font-size:14px; outline:none; transition:border-color .15s;
  }
  .comments-panel input.c-name:focus,
  .comments-panel textarea.c-text:focus{ border-color: var(--purple-soft); }
  .comments-panel textarea.c-text{ resize:none; min-height:70px; }
  .comments-panel .c-submit{
    align-self:flex-end; background:var(--purple); color:#fff; border:none;
    border-radius:12px; padding:10px 20px; font-weight:700; font-size:13.5px;
    cursor:pointer; transition:.15s;
  }
  .comments-panel .c-submit:hover{ filter:brightness(1.1); }
  .comments-panel .c-error{
    display:none; color:var(--warn); font-size:12.5px; background:var(--warn-soft);
    padding:9px 12px; border-radius:10px;
  }
  .comments-panel .c-error.show{ display:block; }
  .comments-panel .c-list{ display:flex; flex-direction:column; gap:12px; }
  .comments-panel .c-item{
    background:#0a0a12; border:1px solid var(--border-soft); border-radius:12px; padding:12px 14px;
  }
  .comments-panel .c-item .c-head{
    display:flex; justify-content:space-between; align-items:baseline; margin-bottom:5px;
  }
  .comments-panel .c-item .c-author{ font-weight:700; font-size:13px; color:var(--cyan); }
  .comments-panel .c-item .c-date{ font-size:10.5px; color:var(--text-faint); }
  .comments-panel .c-item .c-body{ font-size:13.5px; color:var(--text-dim); line-height:1.5; white-space:pre-wrap; }
  .comments-panel .c-empty{ font-size:12.5px; color:var(--text-faint); text-align:center; padding:14px 0; }

  /* ---------- Admin gear + modal ---------- */
  .admin-gear{
    background:none; border:none; color:var(--text-faint); opacity:0.35; font-size:14px;
    cursor:pointer; padding:6px; transition:opacity .15s; vertical-align:middle;
  }
  .admin-gear:hover{ opacity:0.9; }
  .admin-overlay{
    display:none; position:fixed; inset:0; z-index:100; background:rgba(4,4,8,0.72);
    backdrop-filter:blur(6px); align-items:center; justify-content:center; padding:20px;
  }
  .admin-overlay.open{ display:flex; }
  .admin-box{
    width:100%; max-width:480px; max-height:82vh; overflow-y:auto; background:var(--panel);
    border:1px solid var(--border); border-radius:20px; padding:22px;
  }
  .admin-box h3{ margin:0 0 14px; font-size:16px; }
  .admin-box .a-pass-row{ display:flex; gap:8px; }
  .admin-box input.a-pass{
    flex:1; background:#0a0a12; border:1px solid var(--border); border-radius:12px;
    color:var(--text); padding:11px 14px; font-size:14px; outline:none; letter-spacing:2px;
  }
  .admin-box .a-go{
    background:var(--cyan); color:#06231f; border:none; border-radius:12px; padding:0 18px;
    font-weight:800; cursor:pointer;
  }
  .admin-box .a-err{ color:var(--warn); font-size:12px; margin-top:8px; display:none; }
  .admin-box .a-err.show{ display:block; }
  .admin-box .a-tabs{ display:flex; gap:8px; margin-bottom:14px; }
  .admin-box .a-tab{
    flex:1; background:#0a0a12; border:1px solid var(--border); color:var(--text-dim);
    border-radius:10px; padding:9px; font-size:12.5px; font-weight:700; cursor:pointer;
  }
  .admin-box .a-tab.active{ background:var(--purple); color:#fff; border-color:transparent; }
  .admin-box .a-panel{ display:none; }
  .admin-box .a-panel.active{ display:block; }
  .admin-box .a-visit-row{
    display:flex; justify-content:space-between; gap:10px; font-size:12px; padding:9px 0;
    border-bottom:1px solid var(--border-soft); color:var(--text-dim);
  }
  .admin-box .a-visit-row b{ color:var(--text); }
  .admin-box .a-close{
    width:100%; margin-top:14px; background:none; border:1px solid var(--border);
    color:var(--text-dim); border-radius:10px; padding:9px; cursor:pointer;
  }
  .admin-box .a-cmt{ background:#0a0a12; border:1px solid var(--border-soft); border-radius:12px; padding:10px; margin-bottom:10px; }
  .admin-box .a-cmt .a-cmt-meta{ font-size:11px; color:var(--text-faint); margin-bottom:6px; }
  .admin-box .a-cmt textarea{
    width:100%; background:#12121c; border:1px solid var(--border); border-radius:8px;
    color:var(--text); padding:8px; font-size:12.5px; font-family:'Space Grotesk',sans-serif; resize:vertical; min-height:50px;
  }
  .admin-box .a-cmt-actions{ display:flex; gap:8px; margin-top:8px; }
  .admin-box .a-cmt-actions button{
    flex:1; border:none; border-radius:8px; padding:7px; font-size:11.5px; font-weight:700; cursor:pointer;
  }
