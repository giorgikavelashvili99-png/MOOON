<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MOON — ვიდეო მონტაჟის კალკულატორი</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2032%2032%22%3E%0A%3Cdefs%3E%3CradialGradient%20id%3D%22m%22%20cx%3D%2235%25%22%20cy%3D%2230%25%22%20r%3D%2275%25%22%3E%0A%3Cstop%20offset%3D%220%25%22%20stop-color%3D%22%23ffffff%22/%3E%0A%3Cstop%20offset%3D%2245%25%22%20stop-color%3D%22%23e8ecff%22/%3E%0A%3Cstop%20offset%3D%22100%25%22%20stop-color%3D%22%237c8fff%22/%3E%0A%3C/radialGradient%3E%3C/defs%3E%0A%3Ccircle%20cx%3D%2216%22%20cy%3D%2216%22%20r%3D%2214%22%20fill%3D%22url%28%23m%29%22/%3E%0A%3Ccircle%20cx%3D%2221%22%20cy%3D%2220%22%20r%3D%223%22%20fill%3D%22rgba%2820%2C22%2C50%2C0.14%29%22/%3E%0A%3Ccircle%20cx%3D%2211%22%20cy%3D%2222%22%20r%3D%222%22%20fill%3D%22rgba%2820%2C22%2C50%2C0.10%29%22/%3E%0A%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2032%2032%22%3E%0A%3Cdefs%3E%3CradialGradient%20id%3D%22m%22%20cx%3D%2235%25%22%20cy%3D%2230%25%22%20r%3D%2275%25%22%3E%0A%3Cstop%20offset%3D%220%25%22%20stop-color%3D%22%23ffffff%22/%3E%0A%3Cstop%20offset%3D%2245%25%22%20stop-color%3D%22%23e8ecff%22/%3E%0A%3Cstop%20offset%3D%22100%25%22%20stop-color%3D%22%237c8fff%22/%3E%0A%3C/radialGradient%3E%3C/defs%3E%0A%3Ccircle%20cx%3D%2216%22%20cy%3D%2216%22%20r%3D%2214%22%20fill%3D%22url%28%23m%29%22/%3E%0A%3Ccircle%20cx%3D%2221%22%20cy%3D%2220%22%20r%3D%223%22%20fill%3D%22rgba%2820%2C22%2C50%2C0.14%29%22/%3E%0A%3Ccircle%20cx%3D%2211%22%20cy%3D%2222%22%20r%3D%222%22%20fill%3D%22rgba%2820%2C22%2C50%2C0.10%29%22/%3E%0A%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700;800&family=Noto+Sans+Georgian:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #08080d;
    --bg-alt: #0d0d15;
    --panel: #12121c;
    --panel-2: #171724;
    --border: #26263a;
    --border-soft: #1c1c2b;
    --text: #f1f1f6;
    --text-dim: #8b8ba3;
    --text-faint: #55556b;
    --purple: #7c8fff;
    --purple-soft: rgba(124,143,255,0.35);
    --cyan: #cfd8ff;
    --cyan-soft: rgba(207,216,255,0.35);
    --warn: #ff5c3d;
    --warn-soft: rgba(255,92,61,0.35);
    --gold: #cfd8ff;
    --tg: #2ea6ff;
    --tg-soft: rgba(46,166,255,0.35);
    --wa: #25D366;
    --volt: #d7ff2b;
    --volt-soft: rgba(215,255,43,0.4);

    /* --- Moonfade palette (admin panel) --- */
    --moon-bg: #060611;
    --moon-deep: #0a0a1a;
    --moon-silver: #e8ecff;
    --moon-silver-dim: #aab0d6;
    --moon-glow: #cfd8ff;
    --moon-blue: #7c8fff;
    --moon-blue-soft: rgba(124,143,255,0.35);
    --moon-gold: #cfd8ff;
    --moon-crater: rgba(255,255,255,0.05);
    --moon-line: rgba(207,216,255,0.14);
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }

  html,body{
    margin:0; padding:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Space Grotesk', 'Noto Sans Georgian', sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }

  .bg-layer{
    position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;
    transform:translateZ(0); will-change:transform; contain:strict;
  }
  .grain{
    position:absolute; inset:-100px;
    background-image:
      radial-gradient(circle at 20% 20%, rgba(255,255,255,0.02) 0, transparent 1px);
    background-size: 3px 3px;
    opacity:0.5;
  }
  .ruler{
    position:absolute; inset:0;
    background-image: repeating-linear-gradient(
      90deg,
      rgba(255,255,255,0.028) 0px,
      rgba(255,255,255,0.028) 1px,
      transparent 1px,
      transparent 80px
    );
    opacity:0.6;
    mask-image: linear-gradient(180deg, transparent, black 15%, black 85%, transparent);
  }
  .orb{
    position:absolute; border-radius:50%;
    filter:blur(90px);
    opacity:0.35;
    will-change:transform;
    transform:translateZ(0);
  }
  .orb.o1{ width:520px; height:520px; top:-160px; left:-120px; background:radial-gradient(circle, var(--purple), transparent 70%); animation: drift1 22s ease-in-out infinite; }
  .orb.o2{ width:460px; height:460px; bottom:-140px; right:-100px; background:radial-gradient(circle, var(--cyan), transparent 70%); animation: drift2 26s ease-in-out infinite; }
  .orb.o3{ width:340px; height:340px; top:40%; left:60%; background:radial-gradient(circle, var(--purple), transparent 70%); opacity:0.18; animation: drift1 18s ease-in-out infinite reverse; }

  @keyframes drift1{ 0%,100%{ transform:translate(0,0) } 50%{ transform:translate(40px,30px) } }
  @keyframes drift2{ 0%,100%{ transform:translate(0,0) } 50%{ transform:translate(-30px,-40px) } }

  .badge-float{
    position:absolute;
    font-family:'JetBrains Mono', 'Noto Sans Georgian', sans-serif;
    font-weight:800;
    letter-spacing:0.08em;
    border:1px solid var(--border);
    border-radius:14px;
    padding:10px 16px;
    background:rgba(18,18,28,0.4);
    backdrop-filter: blur(6px);
    color:var(--text-dim);
    user-select:none;
  }
  .badge-float.ae{
    top:14%; right:6%;
    color:#b3c6ff;
    text-shadow: 0 0 12px rgba(124,143,255,0.55);
    border-color: rgba(124,143,255,0.3);
    box-shadow: 0 0 30px rgba(124,143,255,0.12);
    animation: float 7s ease-in-out infinite;
  }
  .badge-float.topaz{
    bottom:16%; left:5%;
    color:#dde4ff;
    text-shadow: 0 0 12px rgba(207,216,255,0.55);
    border-color: rgba(207,216,255,0.3);
    box-shadow: 0 0 30px rgba(207,216,255,0.12);
    animation: float 8s ease-in-out infinite 1s;
  }
  .badge-float .gem{
    display:inline-block; width:9px; height:9px; margin-left:8px;
    background:var(--cyan); transform:rotate(45deg);
    box-shadow:0 0 10px var(--cyan);
  }
  .badge-float .spark{
    display:inline-block; width:7px; height:7px; margin-left:8px;
    background:var(--purple); border-radius:2px;
    box-shadow:0 0 10px var(--purple);
  }
  @keyframes float{ 0%,100%{ transform:translateY(0) } 50%{ transform:translateY(-14px) } }

  @media (max-width: 820px){ .badge-float{ display:none; } }

  .scanner-jump-link{
    color: var(--purple);
    font-weight: 800;
    cursor: pointer;
    text-decoration: underline;
    text-decoration-thickness: 1.5px;
    text-underline-offset: 2px;
    text-shadow: 0 0 12px rgba(124,143,255,0.45);
    transition: color .15s, text-shadow .15s;
  }
  .scanner-jump-link:hover,
  .scanner-jump-link:active{
    color: #ff5c72;
    text-shadow: 0 0 12px rgba(124,143,255,0.75);
  }
  .scanner-flash{
    animation: scannerFlash 1.6s ease-out;
  }
  @keyframes scannerFlash{
    0%{ box-shadow: 0 0 0 3px rgba(124,143,255,0.85), 0 0 40px rgba(124,143,255,0.55); border-color: var(--purple); }
    100%{ box-shadow: 0 0 0 0 rgba(124,143,255,0); }
  }

  .wrap{ position:relative; z-index:1; max-width:760px; margin:0 auto; padding:28px 20px 34px; }

  .topbar{
    display:flex; flex-wrap:nowrap; align-items:center; gap:14px;
    padding:14px 18px; margin-bottom:34px;
    border:1px solid var(--border-soft);
    border-radius:16px;
    background:rgba(15,15,24,0.82);
  }
  .topbar-top{
    display:contents;
  }
  .brand{ flex:0 0 auto; display:flex; align-items:center; gap:10px; font-weight:700; letter-spacing:0.05em; font-size:16px; order:1; }
  .topbar-moon{ order:2; }
  .topbar-center{ order:3; }
  .topbar-right{ order:4; }
  .brand .name{
    color:#f2ecff;
    text-shadow:
      0 0 6px rgba(255,255,255,0.7),
      0 0 12px rgba(124,143,255,0.9);
  }
  .brand .dot{ width:9px; height:9px; border-radius:50%; background:var(--cyan); box-shadow:0 0 12px var(--cyan); }
  .visitors-badge{
    font-family:'JetBrains Mono', 'Noto Sans Georgian', sans-serif; font-size:11.5px; color:var(--text-dim);
    display:inline-flex; align-items:center; gap:4px;
    border:1px solid var(--border-soft); border-radius:8px;
    padding:2px 7px; margin-left:2px;
    background:rgba(18,18,28,0.4);
  }
  .visitors-badge b{ color:var(--gold); font-weight:700; text-shadow:0 0 8px rgba(207,216,255,0.5); }
  .vb-moon{
    display:inline-block; flex:0 0 auto;
    width:10px; height:10px; border-radius:50%;
    background:
      radial-gradient(circle at 68% 62%, rgba(20,22,50,0.14) 0 22%, transparent 24%),
      radial-gradient(circle at 34% 68%, #ffffff 0%, var(--moon-silver, #e8ecff) 45%, var(--moon-blue, #7c8fff) 100%);
    box-shadow:0 0 5px rgba(255,255,255,0.7), 0 0 9px rgba(207,216,255,0.65);
    animation: vbMoonGlow 3.2s ease-in-out infinite;
  }
  @keyframes vbMoonGlow{
    0%,100%{ box-shadow:0 0 5px rgba(255,255,255,0.7), 0 0 9px rgba(207,216,255,0.65); }
    50%{ box-shadow:0 0 7px rgba(255,255,255,0.9), 0 0 14px rgba(207,216,255,0.9); }
  }

  .topbar-right{
    display:flex; align-items:center; gap:8px;
    flex:0 0 auto;
  }
  .rating-topbar-badge{
    font-family:'JetBrains Mono', 'Noto Sans Georgian', sans-serif; font-size:12px; font-weight:800;
    color:var(--gold); display:inline-flex; align-items:center; gap:3px;
    border:1px solid rgba(207,216,255,0.35); border-radius:9px;
    padding:5px 10px; background:rgba(207,216,255,0.08);
    text-shadow:0 0 8px rgba(207,216,255,0.5);
    white-space:nowrap; flex:0 0 auto;
  }
  @media (max-width: 480px){
    .rating-topbar-badge{ font-size:10.5px; padding:4px 8px; }
  }

  .social-proof-bar{
    display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap;
    margin:0 0 22px; padding:9px 16px;
    border:1px solid rgba(215,255,43,0.25); border-radius:14px;
    background:rgba(215,255,43,0.06);
    font-family:'JetBrains Mono', 'Noto Sans Georgian', sans-serif; font-size:12px; font-weight:700; letter-spacing:0.03em;
    color:#eaffa0; text-align:center;
  }
  .social-proof-bar b{ color:#fff; font-size:13.5px; text-shadow:0 0 10px rgba(215,255,43,0.5); }
  .social-proof-bar .sp-item{ display:inline-flex; align-items:center; gap:6px; white-space:nowrap; }
  .social-proof-bar .sp-sep{ color:var(--text-faint); opacity:0.6; }
  @media (max-width: 480px){ .social-proof-bar{ font-size:10.5px; padding:8px 10px; gap:5px; } .social-proof-bar b{ font-size:12px; } }

  .promo-box-inline{
    margin:0 auto; padding:16px; max-width:380px;
    border:1px solid rgba(124,143,255,0.35); border-radius:16px;
    background:linear-gradient(160deg, rgba(124,143,255,0.09), rgba(124,143,255,0.02));
    box-shadow:0 8px 22px -12px rgba(124,143,255,0.35);
  }
  .promo-box-inline .promo-row{ display:flex; gap:8px; align-items:center; }
  .promo-box-inline input{
    flex:1 1 auto; min-width:0;
    background:var(--panel-2); border:1px solid var(--border); border-radius:10px;
    color:var(--text); font-family:'JetBrains Mono', 'Noto Sans Georgian', sans-serif; font-size:13px;
    padding:10px 12px; outline:none; transition:border-color .15s ease;
  }
  .promo-box-inline input:focus{ border-color:var(--purple); }
  .promo-box-inline button{
    flex:0 0 auto; border:none; border-radius:10px; padding:10px 18px;
    background:var(--purple); color:#fff; font-weight:700; font-size:12.5px;
    cursor:pointer; font-family:'Space Grotesk', sans-serif; transition:transform .12s ease, filter .12s ease;
  }
  .promo-box-inline button:hover{ filter:brightness(1.1); }
  .promo-box-inline button:active{ transform:scale(0.96); }
  .promo-box-inline .promo-msg{ font-size:11.5px; margin-top:10px; color:var(--text-dim); min-height:14px; line-height:1.5; }
  .promo-box-inline .promo-msg.ok{ color:#eaffa0; }
  .promo-box-inline .promo-msg.bad{ color:var(--warn); }

  .a-form-row{ display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .a-form-row label{ flex:1 1 auto; font-size:12.5px; color:var(--text-dim); }
  .a-form-row input{
    flex:0 0 110px;
    background:var(--panel-2); border:1px solid var(--border); border-radius:8px;
    color:var(--text); font-family:'JetBrains Mono', 'Noto Sans Georgian', sans-serif; font-size:13px;
    padding:7px 10px; outline:none; text-align:center;
  }
  .a-form-row input[type="text"]{ flex:1 1 auto; text-align:left; }
  .a-form-row input:focus{ border-color:var(--moon-blue-soft, var(--purple-soft)); box-shadow:0 0 0 3px rgba(124,143,255,0.15); }
  .a-save-row{ margin-top:6px; transition:transform .15s ease; }
  .a-save-row:active{ transform:scale(0.97); }
  .a-stat-note{ font-size:11px; color:var(--text-faint); margin:-4px 0 12px; }

  .topbar-center{
    flex:1 1 auto; min-width:0;
    display:flex; align-items:center; justify-content:center; gap:8px;
    font-family:'JetBrains Mono', 'Noto Sans Georgian', sans-serif;
    font-size:11px; font-weight:700; letter-spacing:0.14em;
    text-transform:uppercase; text-align:center;
    color:#dbe2ff;
    text-shadow:
      0 0 6px rgba(255,255,255,0.55),
      0 0 12px rgba(207,216,255,0.8);
  }
  .topbar-center .tc-dot{
    width:6px; height:6px; border-radius:50%; flex-shrink:0;
    background:var(--cyan); box-shadow:0 0 10px var(--cyan);
    animation:pulse 1.6s infinite;
  }
  .topbar-center > span:not(.tc-dot){
    min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }

  .topbar-moon{
    display:none;
    flex:0 0 auto;
    width:28px; height:28px;
    max-width:28px; max-height:28px;
    overflow:hidden;
    align-items:center; justify-content:center;
    border-radius:50%;
    font-size:14px; line-height:1;
    -webkit-text-size-adjust:100%; text-size-adjust:100%;
    background:radial-gradient(circle at 35% 30%, #f5f8ff 0%, #cfd8ff 45%, #7c8fff 100%);
    box-shadow:0 0 10px rgba(207,216,255,0.5), 0 0 16px rgba(124,143,255,0.3);
    animation: moonSpin 7s linear infinite, moonGlow 2.6s ease-in-out infinite;
  }
  @keyframes moonSpin{ from{ transform:rotate(0deg); } to{ transform:rotate(360deg); } }
  @keyframes moonGlow{
    0%,100%{ box-shadow:0 0 10px rgba(207,216,255,0.5), 0 0 16px rgba(124,143,255,0.3); }
    50%{ box-shadow:0 0 16px rgba(207,216,255,0.85), 0 0 26px rgba(124,143,255,0.55); }
  }
  @media (prefers-reduced-motion: reduce){
    .topbar-moon{ animation:none; }
  }

  .lang-switch{ flex-shrink:0; display:flex; align-items:center; gap:6px; }
  .lang-btn{
    min-width:44px; height:32px; padding:0 4px; border-radius:9px;
    flex-shrink:0; box-sizing:border-box;
    background:#0e0e17; border:1px solid var(--border);
    font-family:'JetBrains Mono', 'Noto Sans Georgian', sans-serif;
    font-size:11.5px; font-weight:800; letter-spacing:0.04em;
    line-height:1; cursor:pointer; white-space:nowrap;
    color:#ffffff;
    display:flex; align-items:center; justify-content:center;
    opacity:0.45; transition: opacity .2s, border-color .2s, transform .15s, box-shadow .2s, text-shadow .2s;
  }
  .lang-btn:hover{ opacity:0.8; transform:translateY(-1px); }
  .lang-btn.active{
    opacity:1; border-color: var(--purple-soft);
    box-shadow: 0 0 14px rgba(124,143,255,0.35);
    text-shadow:
      0 0 6px rgba(255,255,255,0.9),
      0 0 12px rgba(255,255,255,0.7);
  }
  @media (max-width: 900px){
    .topbar-center{ font-size:10px; letter-spacing:0.08em; }
  }
  @media (max-width: 640px){
    .topbar{ flex-wrap:wrap; padding:12px 14px; row-gap:8px; }
    .topbar-top{
      display:flex; flex-wrap:nowrap; align-items:center; justify-content:space-between;
      flex:1 1 100%; width:100%; gap:8px; min-width:0;
    }
    .brand{ gap:6px; min-width:0; flex-shrink:1; }
    .topbar-right{ gap:6px; flex-shrink:0; }
    .topbar-moon{ display:inline-flex; }
    .brand .name{ font-size:14px; white-space:nowrap; }
    .visitors-badge{ font-size:10px; padding:3px 6px; gap:3px; margin-left:0; white-space:nowrap; }
    .rating-topbar-badge{ font-size:10px; padding:4px 8px; gap:3px; }
    .lang-btn{ width:36px; height:30px; font-size:10px; }
    .topbar-center{
      flex:1 1 100%; order:5;
      font-size:9.5px; letter-spacing:0.08em; gap:6px; margin-top:2px;
    }
    .topbar-center > span:not(.tc-dot){ white-space:normal; overflow:visible; text-overflow:clip; }
  }
  @media (max-width: 480px){
    .topbar-top{ gap:5px; }
    .brand{ gap:4px; }
    .brand .dot{ display:none; }
    .topbar-moon{ width:22px; height:22px; max-width:22px; max-height:22px; font-size:11px; }
  }
  @media (max-width: 360px){
    .brand .name{ font-size:12.5px; }
    .visitors-badge{ font-size:9px; padding:2px 5px; }
    .rating-topbar-badge{ font-size:9px; padding:3px 6px; }
    .lang-btn{ width:32px; height:28px; font-size:9px; }
    .topbar{ padding:10px 10px; }
  }

  .hero{ text-align:center; margin-bottom:38px; }
  .eyebrow{
    font-family:'JetBrains Mono', 'Noto Sans Georgian', sans-serif; font-size:12px; font-weight:700; letter-spacing:0.22em;
    color:#dbe2ff; text-transform:uppercase; margin-bottom:14px;
    text-shadow:
      0 0 6px rgba(255,255,255,0.5),
      0 0 12px rgba(207,216,255,0.85);
  }
  .qn-nav-wrap{
    position:relative;
  }
  .quick-nav{
    display:flex; align-items:center; justify-content:center;
    flex-wrap:wrap; gap:10px;
    margin-bottom:16px;
  }
  .qn-tab{
    appearance:none; -webkit-appearance:none;
    font-family:'JetBrains Mono', 'Noto Sans Georgian', sans-serif;
    font-size:11px; font-weight:700; letter-spacing:0.1em;
    text-transform:uppercase; text-decoration:none;
    margin:0; line-height:1.3;
    padding:9px 16px;
    border-radius:999px;
    border:1px solid var(--border);
    background:rgba(18,18,28,0.85);
    color:#dbe2ff;
    cursor:pointer;
    -webkit-tap-highlight-color: transparent;
    text-shadow: 0 0 6px rgba(255,255,255,0.35), 0 0 12px rgba(207,216,255,0.5);
    box-shadow: 0 0 16px rgba(207,216,255,0.08);
    transition: border-color .2s, box-shadow .2s, transform .15s, background .2s;
    animation: qnGlow 3.2s ease-in-out infinite;
  }
  .qn-tab:nth-child(2){ animation-delay: .5s; }
  .qn-tab:nth-child(3){ animation-delay: 1s; }
  .qn-tab:hover, .qn-tab:focus-visible{
    border-color: var(--purple-soft);
    box-shadow: 0 0 22px rgba(124,143,255,0.3);
    transform: translateY(-1px);
    background:rgba(24,24,36,0.75);
    outline:none;
  }
  .qn-tab:active{ transform:translateY(0); }
  .qn-tab.qn-tab-active{
    border-color: var(--purple);
    box-shadow: 0 0 24px rgba(124,143,255,0.4);

  .quality-btn{
    position:relative;
    min-width:0;
    overflow:visible;
    display:flex; flex-direction:column; align-items:flex-start; gap:4px;
    padding:16px 14px 14px;
    background: linear-gradient(180deg, rgba(255,255,255,0.02), transparent 40%), #0d0d17;
    border:1px solid var(--border-soft);

    cursor:pointer; text-align:left;
    font-family:'Space Grotesk', 'Noto Sans Georgian', sans-serif;

  }
  .quality-btn::before{
    content:''; position:absolute; left:0; top:10px; bottom:10px; width:3px; border-radius:3px;
    background:transparent; transition:background .2s, box-shadow .2s;
  }

    transform: translateY(-1px);

  .quality-btn:active{ transform: translateY(0); }
  .quality-btn.active{
    background: linear-gradient(135deg, var(--qb-tint), rgba(255,255,255,0.015) 65%), #0d0d17;
    border-color: color-mix(in srgb, var(--qb-accent) 45%, var(--border-soft));

  }
  .quality-btn.active::before{
    background: linear-gradient(180deg, var(--qb-accent), var(--qb-accent-2));
    box-shadow:0 0 10px color-mix(in srgb, var(--qb-accent) 65%, transparent);

  .quality-btn.active .q-res{ color:#fff; text-shadow: 0 0 10px color-mix(in srgb, var(--qb-accent) 50%, transparent); }

  .quality-btn .q-fps{

    color:var(--text-faint); text-transform:uppercase;

  .quality-btn .q-price{
    font-family:'JetBrains Mono', 'Noto Sans Georgian', sans-serif; font-size:11px; font-weight:700; letter-spacing:0.01em;

  .quality-btn.active .q-price{ color:var(--qb-accent); text-shadow:0 0 8px color-mix(in srgb, var(--qb-accent) 45%, transparent); }

  .quality-btn .q-check{
    position:absolute; top:10px; right:10px;
    width:18px; height:18px; border-radius:50%; flex:0 0 auto;

  /* q-left/q-right are layout wrappers used only on narrow screens;
     everywhere else they're transparent to the flex layout above. */
  .quality-btn .q-left, .quality-btn .q-right{ display:contents; }

  @media (max-width:720px){
    .quality-grid{ gap:8px; }
    .quality-btn{ padding:14px 12px 12px; }

  @media (max-width:560px){

  @media (max-width:400px){

    .quality-btn .q-right{

    .quality-btn .q-check{

  .qn-drop{
