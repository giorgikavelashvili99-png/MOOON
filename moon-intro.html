<!DOCTYPE html><html lang="ka"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MOON intro</title>
<style>html,body{margin:0;height:100%;background:#040408;overflow:hidden}#replay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:1}#replay.show{display:flex}#replayBtn{font:inherit;font-size:16px;color:#eef3ff;background:rgba(59,109,255,.25);border:1px solid rgba(59,109,255,.6);padding:14px 26px;border-radius:99px;cursor:pointer}</style>
<style id="moonIntroCss">
html.mi-lock{overflow:hidden!important}
#moonIntro{position:fixed;inset:0;z-index:100000;overflow:hidden;background:#040408;color:#eef3ff;font-family:'BPGAcademiuriU','Space Grotesk',sans-serif;font-weight:400;opacity:1;transition:opacity .5s ease}
#moonIntro.mi-out{opacity:0;pointer-events:none}
#moonIntro *{box-sizing:border-box}
#moonIntro:after{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;background:radial-gradient(ellipse 80% 70% at 50% 50%,transparent 55%,rgba(0,0,0,.65))}
.mi-bar{position:absolute;left:0;right:0;height:max(7vh,56px);background:#000;z-index:4;transition:transform 1s cubic-bezier(.2,.8,.2,1)}
.mi-bar.t{top:0;transform:translateY(-100%)}.mi-bar.b{bottom:0;transform:translateY(100%)}
#moonIntro.run .mi-bar{transform:none}
.mi-dots{position:absolute;top:0;left:0;right:0;height:max(7vh,56px);z-index:5;display:flex;gap:7px;align-items:center;justify-content:center}
.mi-dots i{width:7px;height:7px;border-radius:99px;background:rgba(255,255,255,.2);transition:all .35s ease}
.mi-dots i.d{background:rgba(255,255,255,.6)}.mi-dots i.a{width:24px;background:var(--c,#3b6dff)}
.mi-stage{position:absolute;inset:0}
.mi-sc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:70px 20px;text-align:center;animation:miIn .4s ease both,miOut .35s ease forwards;animation-delay:0s,calc(var(--len,99s) - .35s)}
@keyframes miIn{from{opacity:0}to{opacity:1}}@keyframes miOut{to{opacity:0}}
.mi-glow{position:absolute;inset:0;background:radial-gradient(ellipse 75% 50% at 50% 46%,color-mix(in srgb,var(--c,#3b6dff) 30%,transparent),transparent 70%);animation:miBreath 2.5s ease-in-out infinite alternate}
@keyframes miBreath{to{opacity:.55}}
.mi-line{position:relative;display:flex;flex-wrap:wrap;justify-content:center;gap:.12em .3em;font-size:clamp(32px,9vw,76px);line-height:1.2}
.mi-w{display:inline-block;opacity:0;transform:translate3d(0,.6em,0) scale(.9);animation:miW .65s cubic-bezier(.2,.85,.25,1) forwards;animation-delay:var(--d,0s)}
.mi-w.hl{background:linear-gradient(90deg,#3b6dff,#22c3ff);-webkit-background-clip:text;background-clip:text;color:transparent}.mi-w.dim{color:#8a97b5}
@keyframes miW{to{opacity:1;transform:none}}
.mi-sub{position:relative;margin-top:20px;font-size:clamp(14px,3.6vw,20px);color:#9aa7c7;opacity:0;animation:miW .6s ease forwards;animation-delay:var(--d,.6s)}
.mi-cam{position:relative;animation:miPush 2.6s linear both;will-change:transform}
@keyframes miPush{from{transform:scale(1)}to{transform:scale(1.07)}}
.mi-card{width:min(88vw,380px);padding:22px 20px 20px;text-align:left;border-radius:26px;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 22%,#0c0e16),#0a0b12 70%);border:1px solid color-mix(in srgb,var(--c) 60%,transparent);box-shadow:0 30px 90px rgba(0,0,0,.6),0 0 70px color-mix(in srgb,var(--c) 28%,transparent);opacity:0;transform:perspective(900px) translate3d(60px,30px,0) rotateY(-32deg) scale(.88);animation:miCard .85s cubic-bezier(.2,.85,.25,1) .1s forwards;will-change:transform,opacity}
@keyframes miCard{to{opacity:1;transform:perspective(900px) none}}
.mi-top{display:flex;gap:14px;align-items:center}
.mi-ico{width:56px;height:56px;flex:none;border-radius:16px;display:grid;place-items:center;font-size:30px;background:color-mix(in srgb,var(--c) 30%,#111);border:1px solid color-mix(in srgb,var(--c) 70%,transparent);transform:scale(0);animation:miPop .5s cubic-bezier(.2,.9,.3,1.4) .5s forwards}
@keyframes miPop{to{transform:scale(1)}}
.mi-name{font-size:19px;line-height:1.25}.mi-tag{margin-top:3px;font-size:13.5px;color:#aab6d3}
.mi-price{margin:16px 0 14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.1);display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;opacity:0;animation:miW .5s ease .45s forwards}
.mi-num{font-size:46px;line-height:1;color:#fff}.mi-cur{font-size:26px;color:var(--c)}
.mi-old{font-size:17px;color:#7d8aa8;text-decoration:line-through}.mi-unit{font-size:14px;color:#aab6d3}
.mi-ft{display:flex;gap:11px;align-items:center;margin-top:10px;font-size:15px;line-height:1.35;opacity:0;transform:translate3d(-14px,0,0);animation:miW .5s ease forwards;animation-delay:var(--d)}
.mi-ft i{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:13px;color:#06100a;background:var(--c)}
.mi-logo{position:relative;width:min(62vw,300px);height:auto;opacity:0;transform:scale(.7);animation:miLogo .9s cubic-bezier(.2,.85,.25,1) forwards;filter:drop-shadow(0 0 28px rgba(59,109,255,.55))}
@keyframes miLogo{to{opacity:1;transform:none}}
.mi-chips{position:relative;display:flex;gap:10px;margin-top:22px;font-size:26px}
.mi-chips span{opacity:0;transform:translate3d(0,14px,0) scale(.6);animation:miW .5s cubic-bezier(.2,.9,.3,1.3) forwards;animation-delay:var(--d)}
.mi-prog{position:absolute;left:0;right:0;bottom:0;height:3px;z-index:6;background:rgba(255,255,255,.06)}
.mi-prog i{display:block;height:100%;background:linear-gradient(90deg,#3b6dff,#22c3ff);transform:scaleX(0);transform-origin:left}
#moonIntro.run .mi-prog i{animation:miProg var(--dur) linear forwards}
@keyframes miProg{to{transform:scaleX(1)}}
.mi-skip{position:absolute;right:max(14px,env(safe-area-inset-right));bottom:max(6px,calc(env(safe-area-inset-bottom) + 2px));z-index:7;display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:99px;cursor:pointer;font:inherit;font-size:14px;color:#eef3ff;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);touch-action:manipulation}
.mi-skip:active{transform:scale(.95)}.mi-skip small{opacity:.6;font-size:12px}
@media (prefers-reduced-motion:reduce){.mi-cam{animation:none}.mi-card,.mi-w,.mi-ft,.mi-ico{animation-duration:.25s!important}}
</style></head><body><div id="replay"><button id="replayBtn" type="button">↻ თავიდან ნახვა</button></div>

var T0=3500,CARD=2500,END=T0+CARD*C.length+3300;
el.style.setProperty('--dur',(END/1000)+'s');
function w(txt,d,cls){return '<span class="mi-w '+(cls||'')+'" style="--d:'+d+'s">'+txt+'</span>';}
function title(){stage.innerHTML='<div class="mi-sc" style="--len:'+(T0/1000)+'s"><div class="mi-line">'+w('გინდა',.1,'dim')+w('ვიდეო',.35)+w('მონტაჟი',.6)+'</div><div class="mi-line" style="margin-top:.1em">'+w('ყველაზე',1.1,'dim')+w('ხელმისაწვდომ',1.4,'hl')+w('ფასებში?',1.75,'hl')+'</div><div class="mi-sub" style="--d:2.4s">გაიცანი ჩვენი '+C.length+' პაკეტი</div></div>';}
function setDots(a){dots.querySelectorAll('i').forEach(function(d,k){d.className=k<a?'d':(k===a?'a':'');});}
function card(i){
 var d=C[i];el.style.setProperty('--c',d.c);setDots(i);
 var fs=d.f.map(function(x,k){return '<div class="mi-ft" style="--d:'+(1.0+k*.35)+'s"><i>✓</i><span>'+x+'</span></div>';}).join('');
 stage.innerHTML='<div class="mi-sc" style="--c:'+d.c+';--len:'+(CARD/1000)+'s"><div class="mi-glow"></div><div class="mi-cam"><div class="mi-card"><div class="mi-top"><div class="mi-ico">'+d.e+'</div><div><div class="mi-name">'+d.n+'</div><div class="mi-tag">'+d.t+'</div></div></div><div class="mi-price"><span class="mi-num">0.00</span><span class="mi-cur">₾</span>'+(d.o?'<span class="mi-old">'+d.o.toFixed(2)+' ₾</span>':'')+(d.u?'<span class="mi-unit">'+d.u+'</span>':'')+'</div>'+fs+'</div></div></div>';
 var n=stage.querySelector('.mi-num'),t0=null,dur=900,del=450;
 function step(ts){if(done)return;if(t0===null)t0=ts;var k=Math.min(Math.max((ts-t0-del)/dur,0),1);n.textContent=(d.p*(1-Math.pow(1-k,3))).toFixed(2);if(k<1)requestAnimationFrame(step);}
 requestAnimationFrame(step);
}
function finale(){
 el.style.setProperty('--c','#3b6dff');setDots(C.length);
 var chips=C.map(function(d,k){return '<span style="--d:'+(.9+k*.12)+'s">'+d.e+'</span>';}).join('');
 var src=LOGO||(document.querySelector('.brand-logo-img,.brand-name-logo')||{}).src||'';
 stage.innerHTML='<div class="mi-sc"><div class="mi-glow"></div>'+(src?'<img class="mi-logo" alt="MOON" src="'+src+'">':'')+'<div class="mi-sub" style="--d:.7s">აირჩიე შენი პაკეტი</div><div class="mi-chips">'+chips+'</div></div>';
}
function finish(){
 if(done)return;done=true;timers.forEach(clearTimeout);el.classList.add('mi-out');
 setTimeout(function(){if(STANDALONE){document.getElementById('replay').classList.add('show');}else{el.remove();root.classList.remove('mi-lock');}},520);
}
function play(){
 done=false;timers.forEach(clearTimeout);timers=[];
 if(!STANDALONE)root.classList.add('mi-lock');
 dots.innerHTML=C.map(function(){return '<i></i>';}).join('');
 el.classList.remove('run','mi-out');void el.offsetWidth;el.classList.add('run');
 title();setDots(-1);
 C.forEach(function(_,i){timers.push(setTimeout(function(){card(i);},T0+CARD*i));});
 timers.push(setTimeout(finale,T0+CARD*C.length));
 timers.push(setTimeout(finish,END));
}
document.getElementById('miSkip').addEventListener('click',finish);
document.addEventListener('keydown',function(e){if(e.key==='Escape')finish();});
if(STANDALONE){document.getElementById('replayBtn').addEventListener('click',play);}
play();
